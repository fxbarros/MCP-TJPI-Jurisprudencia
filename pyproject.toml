[project]
name = "jurisprudencia-tjpi-mcp"
version = "0.1.0"
description = "Servidor MCP para pesquisa de jurisprudência no site oficial do TJ-PI (busca, leitura de decisões e verificação de citações)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "mcp[cli]>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jurisprudencia-tjpi-mcp = "jurisprudencia_tjpi_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
